
<template>
    <lightning-card title="Cancel My Booking" icon-name="standard:event">
        <div class="slds-p-around_medium">
            <p class="slds-m-bottom_medium">
                To cancel a booking, enter the ticket code and the email
                address used when booking.
            </p>

            <lightning-input
                label="Ticket Code"
                value={ticketCode}
                onchange={handleTicketCodeChange}
                placeholder="EVT26-T-0153"
                required
                disabled={isLoading}>
            </lightning-input>

            <lightning-input
                class="slds-m-top_small"
                type="email"
                label="Booking Email"
                value={attendeeEmail}
                onchange={handleEmailChange}
                placeholder="Enter your booking email"
                required
                disabled={isLoading}>
            </lightning-input>

            <div class="slds-m-top_medium">
                <lightning-button
                    label="Find Booking"
                    variant="brand"
                    onclick={handleFindBooking}
                    disabled={isLoading}>
                </lightning-button>
            </div>

            <template lwc:if={isLoading}>
                <div class="slds-m-top_medium">
                    <lightning-spinner
                        alternative-text="Processing booking">
                    </lightning-spinner>
                </div>
            </template>

            <template lwc:if={errorMessage}>
                <div class="slds-text-color_error slds-m-top_medium"
                     role="alert">
                    {errorMessage}
                </div>
            </template>

            <template lwc:if={successMessage}>
                <div class="slds-text-color_success slds-m-top_medium"
                     role="status">
                    {successMessage}
                </div>
            </template>

            <template lwc:if={booking}>
                <div class="slds-box slds-m-top_large">
                    <h2 class="slds-text-heading_medium">
                        Booking Found
                    </h2>

                    <p class="slds-m-top_small">
                        Your ticket matches the details entered.
                    </p>

                    <template lwc:if={canCancelBooking}>
                        <div class="slds-m-top_medium">
                            <lightning-button
                                label="Cancel Booking"
                                variant="destructive"
                                onclick={handleCancelBooking}
                                disabled={isLoading}>
                            </lightning-button>
                        </div>

                        <p class="slds-text-body_small slds-m-top_small">
                            Cancellation changes your ticket status to
                            Cancelled.
                        </p>
                    </template>

                    <template lwc:else>
                        <p class="slds-m-top_medium">
                            This ticket cannot be cancelled online.
                            Its current status is {booking.status}.
                        </p>
                    </template>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
