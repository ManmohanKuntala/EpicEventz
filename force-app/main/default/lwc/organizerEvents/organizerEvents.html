
<template>
    <lightning-card title="Manage Events" icon-name="standard:event">
        <div class="slds-p-around_medium">
            <template if:true={events.length}>
                <template for:each={events} for:item="event">
                    <div key={event.Id} class="event-row slds-p-around_small">
                        <a href={event.recordUrl}
                           target="_blank"
                           rel="noopener noreferrer"
                           class="event-link">
                            {event.Name}
                        </a>
                    </div>
                </template>
            </template>

            <template if:true={error}>
                <p class="slds-text-color_error">
                    Unable to load events. Please check your access.
                </p>
            </template>

            <template if:true={isEmpty}>
                <p>No events found.</p>
            </template>
        </div>
    </lightning-card>
</template>
